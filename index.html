<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafaf9" />
    <meta
      name="description"
      content="BANKNIFTY options bot — live status, open positions and P&amp;L for paper and live trading."
    />

    <!-- Installed-app behaviour. The web manifest itself is injected by
         vite-plugin-pwa (see vite.config.js); iOS still reads these tags
         rather than the manifest for the home-screen title, icon and status
         bar. "default" keeps the status bar opaque, so nothing on the page
         ever has to be pushed down to clear it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trading Admin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Inter, preconnected so the first paint is not blocked on a cold DNS
         lookup. `tnum` is enabled in CSS, not here, because it should apply to
         numeric columns only — not to the whole UI. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Trading Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
