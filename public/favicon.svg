<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#0c0a09" />
  <!-- Three candles stepping up, with the wick of the last one breaking out
       above the body — the shape of the signal this bridge trades. -->
  <g stroke="#fafaf9" stroke-linecap="round" stroke-width="2.5">
    <path d="M9 22.5v-4.5" />
    <path d="M16 22.5v-8.5" />
    <path d="M23 22.5v-13" />
  </g>
  <circle cx="23" cy="7.5" r="2.5" fill="#34d399" />
</svg>
